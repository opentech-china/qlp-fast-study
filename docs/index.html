<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速学习助手</title>
    <link rel="stylesheet" href="index.css">
    <script src="study.js"></script>
</head>

<body>
    <div class="container">
        <h1>快速学习助手</h1>

        <div class="input-section">
            <div class="input-group">
                <label for="authorization">Authorization Token</label>
                <!-- 新增包裹容器，实现输入框和按钮横向排列 -->
                <div class="input-btn-wrapper">
                    <input type="text" id="authorization" placeholder="请输入你的Authorization令牌" />
                    <button id="getAuthBtn">自动获取authorization</button>
                    <button id="startBtn">开始学习</button>
                </div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">准备就绪</div>
        </div>

        <div class="tables-container">
            <div class="article-list-section">
                <h2>待学习文章列表</h2>
                <div class="table-container">
                    <table id="articleListTable">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>文章ID</th>
                                <th>文章标题</th>
                            </tr>
                        </thead>
                        <tbody id="articleListBody">
                            <!-- 文章列表将在这里动态生成 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="result-section">
                <h2>学习结果</h2>
                <div class="table-container">
                    <table id="resultTable">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>文章ID</th>
                                <th>状态码</th>
                                <th>状态信息</th>
                                <th>得分</th>
                            </tr>
                        </thead>
                        <tbody id="resultTableBody">
                            <!-- 结果将在这里动态添加 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 二维码模态框 -->
    <div class="modal" id="qrcodeModal">
        <div class="modal-content">
            <h2>扫码登录</h2>
            <p>请使用微信扫描下方二维码进行登录</p>

            <div class="qrcode-loading" id="qrcodeLoading">
                <div class="loading-spinner"></div>
                <span style="margin-left: 10px;">二维码正在加载中...</span>
            </div>
            <img src="" alt="登录二维码" class="qrcode-img hidden" id="qrcodeImg">
            
            <div class="modal-footer">
                <button id="loadTokenBtn">加载token</button>
                <button class="close-modal">关闭</button>
            </div>
        </div>
    </div>

</body>

</html>
